name: Bug
description: Something on the site is broken or wrong
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open /bikes on a phone\n2. …"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page/URL and device/browser
  - type: textarea
    id: files
    attributes:
      label: Affected files (if known)
  - type: dropdown
    id: tier
    attributes:
      label: Risk tier
      description: See docs/agents/risk-tiers.md
      options:
        - "3 — normal"
        - "2 — careful"
        - "1 — critical"
    validations:
      required: true
